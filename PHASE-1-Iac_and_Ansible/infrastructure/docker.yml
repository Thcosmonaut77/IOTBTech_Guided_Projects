---
# Installs Docker CE from the official repo (Debian/Ubuntu) and runs nginx on port 80.
# Requires community.docker, declared in requirements.yml and installed by
# setup-ansible.sh step 3/6.
- name: Install Docker and deploy nginx container
  hosts: workers
  become: true

  vars:
    nginx_image: nginx:stable
    nginx_container_name: nginx
    nginx_host_port: 80
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map[ansible_architecture] | default('amd64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and the Python Docker SDK
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - python3-docker
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run nginx container on port 80
      community.docker.docker_container:
        name: "{{ nginx_container_name }}"
        image: "{{ nginx_image }}"
        state: started
        pull: true
        restart_policy: unless-stopped
        published_ports:
          - "{{ nginx_host_port }}:80"

    - name: Verify nginx responds on port 80
      ansible.builtin.uri:
        url: "http://localhost:{{ nginx_host_port }}"
        status_code: 200
      register: nginx_check
      retries: 5
      delay: 3
      until: nginx_check.status == 200
